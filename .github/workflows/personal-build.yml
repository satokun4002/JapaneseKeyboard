name: Personal Build (fullStandard Release)

# 個人用ビルド: スマホの GitHub 画面から手動実行して署名付き APK を得るための最小構成。
# 上流の android.yml (Android Release CI) の実績ある手順から、fullStandard の
# リリース APK だけに絞ったもの。lite / AAB / F-Droid 系は作らない。
#
# 事前にリポジトリの Secrets へ登録が必要:
#   KEYSTORE_BASE64    署名鍵 (.p12 / PKCS12) の Base64 全文
#   KEYSTORE_PASSWORD  キーストアのパスワード
#   KEY_ALIAS          鍵のエイリアス
#   KEY_PASSWORD       鍵のパスワード
# 任意:
#   HF_TOKEN           zenz モデル取得用 (公開モデルなので通常は不要)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZENZ_MODEL_CACHE_DIR: ${{ github.workspace }}/.zenz-model-cache

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: true

      - name: Install Android API 37 and release NDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache zenz model
        uses: actions/cache@v4
        with:
          path: .zenz-model-cache
          key: ${{ runner.os }}-zenz-model-v2-4f5423f0fad41a73b1242eb96fe5c12ae4fdca83-Q5_K_M-ggml-model-Q5_K_M.gguf

      - name: Decode keystore from Base64
        # 鍵は PKCS12 形式 (.p12) で用意する。拡張子で AGP が形式を判定するため、
        # 中身が PKCS12 なら .jks 名にしてはいけない (上流CIは本物のJKS前提)。
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-release-key.p12

      - name: Add signing info to local.properties
        run: |
          if [ ! -f local.properties ]; then
            touch local.properties
          fi
          KEYSTORE_PATH=$(pwd)/my-release-key.p12
          echo "# --- SigningConfig for CI ---" >> local.properties
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> local.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> local.properties

      - name: Build fullStandard Release APK
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./gradlew :app:assembleFullStandardRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sumire-fullStandard-release-apk
          path: app/build/outputs/apk/fullStandard/release/*.apk
          if-no-files-found: error
          retention-days: 30
